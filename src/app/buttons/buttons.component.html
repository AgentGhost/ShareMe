@if (songs | async; as songs) {
  <div class="button --filled clear" role="button" tabindex="0" (click)="clear()" (key.enter)="clear()">
    <i class="material-icons">delete_outline</i>
    @if (!songs.length) {
      <span>Clear</span>
    }
    @if (songs.length) {
      <span>( {{ songs.length }} )</span>
    }
  </div>
  <div class="button-group">
    @if (isShareSupported) {
      <div
        class="button --filled share"
        role="button"
        tabindex="0"
        (click)="share()"
        (key.enter)="share()"
        >
        <i class="material-icons">share</i>Share
      </div>
    }
    @if (isCopySupported) {
      <div
        class="button --filled copy"
        role="button"
        tabindex="0"
        (click)="copy()"
        (key.enter)="copy()"
        >
        <i class="material-icons">filter_none</i>Copy
      </div>
    }
  </div>
}
